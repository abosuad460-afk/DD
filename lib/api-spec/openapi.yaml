openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: واجهة نظام مخزون الأدوية الذكي
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: medicines
  - name: alerts
  - name: supply
  - name: alternatives
  - name: weather
  - name: access
  - name: beneficiaries
  - name: partners
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: ملخص لوحة التحكم
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /medicines:
    get:
      operationId: listMedicines
      tags: [medicines]
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/StockStatus"
        - in: query
          name: priority
          schema:
            $ref: "#/components/schemas/MedicinePriority"
      responses:
        "200":
          description: قائمة الأدوية
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Medicine"
  /medicines/{id}:
    patch:
      operationId: updateMedicine
      tags: [medicines]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicineUpdate"
      responses:
        "200":
          description: الدواء بعد التحديث
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Medicine"
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      responses:
        "200":
          description: قائمة التنبيهات
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
  /alerts/{id}/acknowledge:
    patch:
      operationId: acknowledgeAlert
      tags: [alerts]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: التنبيه بعد الاعتماد
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
  /supply-orders:
    get:
      operationId: listSupplyOrders
      tags: [supply]
      responses:
        "200":
          description: طلبات التوريد
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyOrder"
    post:
      operationId: createSupplyOrder
      tags: [supply]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyOrderInput"
      responses:
        "201":
          description: طلب التوريد المنشأ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOrder"
  /supply-orders/{id}:
    patch:
      operationId: updateSupplyOrder
      tags: [supply]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyOrderUpdate"
      responses:
        "200":
          description: طلب التوريد بعد التحديث
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyOrder"
  /alternatives:
    get:
      operationId: listAlternatives
      tags: [alternatives]
      responses:
        "200":
          description: البدائل العلاجية المقترحة
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alternative"
  /alternatives/{id}/decision:
    patch:
      operationId: decideAlternative
      tags: [alternatives]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlternativeDecision"
      responses:
        "200":
          description: البديل بعد قرار الصيدلي
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alternative"
  /weather:
    get:
      operationId: getWeatherRisk
      tags: [weather]
      responses:
        "200":
          description: حالة الطقس ومخاطر التوريد
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherRisk"
  /access/me:
    get:
      operationId: getMyAccess
      tags: [access]
      responses:
        "200":
          description: صلاحيات المستخدم الحالي
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccess"
  /beneficiary-applications:
    get:
      operationId: listBeneficiaryApplications
      tags: [beneficiaries]
      responses:
        "200":
          description: طلبات انضمام المستفيدين
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BeneficiaryApplication"
    post:
      operationId: createBeneficiaryApplication
      tags: [beneficiaries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiaryApplicationInput"
      responses:
        "201":
          description: طلب الانضمام المنشأ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiaryApplication"
  /beneficiary-applications/{id}/decision:
    patch:
      operationId: decideBeneficiaryApplication
      tags: [beneficiaries]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeneficiaryDecision"
      responses:
        "200":
          description: الطلب بعد القرار
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiaryApplication"
  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      responses:
        "200":
          description: الجهات الشريكة
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"
    post:
      operationId: createPartner
      tags: [partners]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerInput"
      responses:
        "201":
          description: الجهة المنشأة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
  /partners/{id}:
    patch:
      operationId: updatePartner
      tags: [partners]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdate"
      responses:
        "200":
          description: الجهة بعد التحديث
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
    delete:
      operationId: deletePartner
      tags: [partners]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: تم حذف الجهة
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer }
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    StockStatus:
      type: string
      enum: [available, low, critical]
    MedicinePriority:
      type: string
      enum: [vital, essential, desirable]
    SupplyStatus:
      type: string
      enum: [draft, ordered, shipped, received, delayed]
    AlertSeverity:
      type: string
      enum: [info, warning, critical]
    DecisionStatus:
      type: string
      enum: [pending, approved, rejected]
    UserRole:
      type: string
      enum: [admin, pharmacist, supply_manager, beneficiary]
    UserAccess:
      type: object
      required: [userId, role, permissions]
      properties:
        userId: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        permissions:
          type: array
          items: { type: string }
    BeneficiaryApplication:
      type: object
      required: [id, userId, fullName, email, phone, organization, organizationType, requestedRole, status, submittedAt, reviewedAt, reviewerNote]
      properties:
        id: { type: integer }
        userId: { type: string }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        organization: { type: string }
        organizationType: { type: string }
        requestedRole: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/DecisionStatus" }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: string }
        reviewerNote: { type: string }
    BeneficiaryApplicationInput:
      type: object
      required: [fullName, email, phone, organization, organizationType, requestedRole]
      properties:
        fullName: { type: string, minLength: 2 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 8 }
        organization: { type: string, minLength: 2 }
        organizationType: { type: string }
        requestedRole: { $ref: "#/components/schemas/UserRole" }
    BeneficiaryDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reviewerNote: { type: string }
        assignedRole: { $ref: "#/components/schemas/UserRole" }
    Partner:
      type: object
      required: [id, name, type, city, contactName, contactEmail, contactPhone, status, medicinesCount, joinedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string }
        city: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        status:
          type: string
          enum: [active, suspended, onboarding]
        medicinesCount: { type: integer }
        joinedAt: { type: string, format: date }
    PartnerInput:
      type: object
      required: [name, type, city, contactName, contactEmail, contactPhone]
      properties:
        name: { type: string, minLength: 2 }
        type: { type: string }
        city: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
    PartnerUpdate:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        city: { type: string }
        contactName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        status:
          type: string
          enum: [active, suspended, onboarding]
    Medicine:
      type: object
      required: [id, name, scientificName, sku, category, stock, unit, reorderPoint, safeStock, dailyConsumption, status, priority, expiryDate, location, predictedRunoutDate, coverageDays]
      properties:
        id: { type: integer }
        name: { type: string }
        scientificName: { type: string }
        sku: { type: string }
        category: { type: string }
        stock: { type: integer }
        unit: { type: string }
        reorderPoint: { type: integer }
        safeStock: { type: integer }
        dailyConsumption: { type: number }
        status: { $ref: "#/components/schemas/StockStatus" }
        priority: { $ref: "#/components/schemas/MedicinePriority" }
        expiryDate: { type: string, format: date }
        location: { type: string }
        predictedRunoutDate: { type: string, format: date }
        coverageDays: { type: integer }
    MedicineUpdate:
      type: object
      properties:
        stock: { type: integer, minimum: 0 }
        reorderPoint: { type: integer, minimum: 0 }
        safeStock: { type: integer, minimum: 0 }
        priority: { $ref: "#/components/schemas/MedicinePriority" }
    Alert:
      type: object
      required: [id, medicineId, medicineName, title, message, severity, createdAt, acknowledged]
      properties:
        id: { type: integer }
        medicineId: { type: integer }
        medicineName: { type: string }
        title: { type: string }
        message: { type: string }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        createdAt: { type: string, format: date-time }
        acknowledged: { type: boolean }
    SupplyOrder:
      type: object
      required: [id, orderNumber, supplier, medicineId, medicineName, quantity, status, orderedAt, expectedArrival, priority]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        supplier: { type: string }
        medicineId: { type: integer }
        medicineName: { type: string }
        quantity: { type: integer }
        status: { $ref: "#/components/schemas/SupplyStatus" }
        orderedAt: { type: string, format: date }
        expectedArrival: { type: string, format: date }
        priority: { $ref: "#/components/schemas/MedicinePriority" }
    SupplyOrderInput:
      type: object
      required: [supplier, medicineId, medicineName, quantity, expectedArrival, priority]
      properties:
        supplier: { type: string, minLength: 2 }
        medicineId: { type: integer }
        medicineName: { type: string }
        quantity: { type: integer, minimum: 1 }
        expectedArrival: { type: string, format: date }
        priority: { $ref: "#/components/schemas/MedicinePriority" }
    SupplyOrderUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/SupplyStatus" }
        expectedArrival: { type: string, format: date }
    Alternative:
      type: object
      required: [id, medicineId, medicineName, alternativeName, activeIngredient, availableStock, similarity, decision, pharmacistNote]
      properties:
        id: { type: integer }
        medicineId: { type: integer }
        medicineName: { type: string }
        alternativeName: { type: string }
        activeIngredient: { type: string }
        availableStock: { type: integer }
        similarity: { type: integer }
        decision: { $ref: "#/components/schemas/DecisionStatus" }
        pharmacistNote: { type: string }
    AlternativeDecision:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        pharmacistNote: { type: string }
    Dashboard:
      type: object
      required: [totalMedicines, availableCount, lowCount, criticalCount, activeAlerts, openOrders, stockHealth, monthlyStockouts, earlyDetectionRate, averageDispenseMinutes, consumptionTrend, predictedRunouts, recentAlerts, upcomingOrders]
      properties:
        totalMedicines: { type: integer }
        availableCount: { type: integer }
        lowCount: { type: integer }
        criticalCount: { type: integer }
        activeAlerts: { type: integer }
        openOrders: { type: integer }
        stockHealth: { type: integer }
        monthlyStockouts: { type: integer }
        earlyDetectionRate: { type: integer }
        averageDispenseMinutes: { type: number }
        consumptionTrend:
          type: array
          items:
            $ref: "#/components/schemas/ConsumptionPoint"
        predictedRunouts:
          type: array
          items:
            $ref: "#/components/schemas/Medicine"
        recentAlerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        upcomingOrders:
          type: array
          items:
            $ref: "#/components/schemas/SupplyOrder"
    ConsumptionPoint:
      type: object
      required: [day, dispensed, received]
      properties:
        day: { type: string }
        dispensed: { type: integer }
        received: { type: integer }
    WeatherRisk:
      type: object
      required: [city, temperature, condition, severity, riskWindow, recommendation, affectedOrders, updatedAt]
      properties:
        city: { type: string }
        temperature: { type: integer }
        condition: { type: string }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        riskWindow: { type: string }
        recommendation: { type: string }
        affectedOrders: { type: integer }
        updatedAt: { type: string, format: date-time }